<title>Android Launcher</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        background: white;
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    header h1 {
        margin: 0 0 6px;
        font-size: 24px;
    }

    header p {
        margin: 0;
        color: #777;
        font-size: 13px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px 12px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .card {
        min-height: 120px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-decoration: none;
        color: #222;

        transition: .15s;
    }

    .card:hover {
        box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .card:active {
        transform: scale(.96);
    }

    .icon {
        font-size: 35px;
        margin-bottom: 10px;
    }

    .name {
        font-weight: bold;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
```

</head>

<body>

<header>
    <h1>Android Launcher</h1>
    <p>Package intent test</p>
</header>

<div class="container">

```
<div class="grid">

    <!-- Android Settings -->
    <a class="card"
       href="intent://com.android.settings/#Intent;scheme=android-app;end">
        <div class="icon">⚙️</div>
        <div class="name">Settings</div>
    </a>

    <!-- YouTube -->
    <a class="card"
       href="intent://com.google.android.youtube/#Intent;scheme=android-app;end">
        <div class="icon">▶️</div>
        <div class="name">YouTube</div>
    </a>

    <!-- Chrome -->
    <a class="card"
       href="intent://com.android.chrome/#Intent;scheme=android-app;end">
        <div class="icon">🌐</div>
        <div class="name">Chrome</div>
    </a>

    <!-- Calculator -->
    <a class="card"
       href="intent://com.google.android.calculator/#Intent;scheme=android-app;end">
        <div class="icon">🧮</div>
        <div class="name">Calculator</div>
    </a>

    <!-- Files -->
    <a class="card"
       href="intent://com.google.android.documentsui/#Intent;scheme=android-app;end">
        <div class="icon">📁</div>
        <div class="name">Files</div>
    </a>

    <!-- Phone -->
    <a class="card"
       href="intent://com.google.android.dialer/#Intent;scheme=android-app;end">
        <div class="icon">📞</div>
        <div class="name">Phone</div>
    </a>

</div>
